name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @shellbell/mobile check:vectors
      - run: pnpm -F @shellbell/mobile doctor
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm -F @shellbell/protocol gen:protocol-doc && git diff --exit-code docs/protocol.md
      - run: pnpm -F shellbell check:bundle
      - run: bash apps/agent/scripts/pack-smoke.sh
        env:
          TMPDIR: ${{ runner.temp }}
